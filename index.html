<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ViewTube</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg aria-hidden="true" class="icon-sprite" focusable="false">
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m16 16 4 4"></path>
      </symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Z"></path>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"></path>
      </symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24">
        <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path>
        <path d="M10 21h4"></path>
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
      </symbol>
      <symbol id="icon-shorts" viewBox="0 0 24 24">
        <path d="M14 3 7 6a4 4 0 0 0 0 7l3 1"></path>
        <path d="m10 21 7-3a4 4 0 0 0 0-7l-3-1"></path>
        <path d="m10 9 5 3-5 3Z"></path>
      </symbol>
      <symbol id="icon-subscriptions" viewBox="0 0 24 24">
        <rect x="4" y="6" width="16" height="12" rx="2"></rect>
        <path d="m10 10 5 2-5 2Z"></path>
        <path d="M7 3h10"></path>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v6l4 2"></path>
      </symbol>
      <symbol id="icon-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8Z"></path>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7Z"></path>
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__start">
          <button class="icon-button" id="menuButton" type="button" aria-label="Menu" title="Menu">
            <svg><use href="#icon-menu"></use></svg>
          </button>
          <a class="brand" href="#" aria-label="ViewTube home">
            <span class="brand__mark">
              <svg aria-hidden="true"><use href="#icon-play"></use></svg>
            </span>
            <span class="brand__name">ViewTube</span>
          </a>
        </div>

        <form class="search" id="searchForm" role="search">
          <label class="sr-only" for="searchInput">Search</label>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search">
          <button class="search__button" type="submit" aria-label="Search" title="Search">
            <svg><use href="#icon-search"></use></svg>
          </button>
        </form>

        <div class="topbar__actions">
          <button class="icon-button hide-small" type="button" aria-label="Voice search" title="Voice search">
            <svg><use href="#icon-mic"></use></svg>
          </button>
          <button class="pill-button hide-small" type="button">
            <svg><use href="#icon-plus"></use></svg>
            <span>Create</span>
          </button>
          <button class="icon-button" type="button" aria-label="Notifications" title="Notifications">
            <svg><use href="#icon-bell"></use></svg>
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <button class="avatar-button" type="button" aria-label="Account" title="Account">C</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Primary">
          <nav class="side-nav">
            <button class="side-link is-active" type="button">
              <svg><use href="#icon-home"></use></svg>
              <span>Home</span>
            </button>
            <button class="side-link" type="button">
              <svg><use href="#icon-shorts"></use></svg>
              <span>Shorts</span>
            </button>
            <button class="side-link" type="button">
              <svg><use href="#icon-subscriptions"></use></svg>
              <span>Subscriptions</span>
            </button>
            <hr>
            <button class="side-link" type="button">
              <svg><use href="#icon-clock"></use></svg>
              <span>History</span>
            </button>
            <button class="side-link" type="button">
              <svg><use href="#icon-compass"></use></svg>
              <span>Explore</span>
            </button>
          </nav>

          <section class="subscription-list" aria-labelledby="subscriptionsTitle">
            <h2 id="subscriptionsTitle">Subscriptions</h2>
            <button class="channel-link" type="button"><span class="channel-dot sky">LD</span><span>Launch Desk</span></button>
            <button class="channel-link" type="button"><span class="channel-dot coral">RM</span><span>Recipe Mode</span></button>
            <button class="channel-link" type="button"><span class="channel-dot lime">PX</span><span>Pixel Quest</span></button>
            <button class="channel-link" type="button"><span class="channel-dot violet">ST</span><span>Studio Tech</span></button>
          </section>
        </aside>

        <main class="feed" id="mainContent">
          <section class="chip-row" id="chipRow" aria-label="Topics"></section>

          <section class="feed-header" aria-labelledby="homeTitle">
            <div>
              <h1 id="homeTitle">Home</h1>
              <p id="resultSummary">Recommended videos</p>
            </div>
            <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
          </section>

          <section class="video-grid" id="videoGrid" aria-label="Recommended videos"></section>

          <section class="shorts-section" aria-labelledby="shortsTitle">
            <div class="section-title">
              <svg aria-hidden="true"><use href="#icon-shorts"></use></svg>
              <h2 id="shortsTitle">Shorts</h2>
            </div>
            <div class="shorts-grid" id="shortsGrid"></div>
          </section>
        </main>
      </div>

      <nav class="bottom-nav" aria-label="Mobile primary">
        <button class="bottom-link is-active" type="button">
          <svg><use href="#icon-home"></use></svg>
          <span>Home</span>
        </button>
        <button class="bottom-link" type="button">
          <svg><use href="#icon-shorts"></use></svg>
          <span>Shorts</span>
        </button>
        <button class="bottom-link" type="button">
          <svg><use href="#icon-plus"></use></svg>
          <span>Create</span>
        </button>
        <button class="bottom-link" type="button">
          <svg><use href="#icon-subscriptions"></use></svg>
          <span>Subs</span>
        </button>
        <button class="bottom-link" type="button">
          <svg><use href="#icon-user"></use></svg>
          <span>You</span>
        </button>
      </nav>
    </div>

    <section class="watch-drawer" id="watchDrawer" aria-labelledby="watchTitle" aria-modal="true" role="dialog" hidden>
      <div class="watch-drawer__scrim" data-close-watch></div>
      <div class="watch-drawer__content">
        <div class="watch-main">
          <div class="player" id="watchPlayer">
            <img id="watchImage" alt="">
            <div class="player__bar">
              <span class="player__progress"></span>
            </div>
            <button class="player__play" type="button" aria-label="Play">
              <svg><use href="#icon-play"></use></svg>
            </button>
          </div>
          <h2 id="watchTitle"></h2>
          <div class="watch-meta">
            <div class="watch-channel">
              <span class="channel-dot" id="watchAvatar"></span>
              <div>
                <strong id="watchChannel"></strong>
                <span id="watchSubscribers"></span>
              </div>
            </div>
            <button class="subscribe-button" type="button">Subscribe</button>
          </div>
          <p class="watch-description" id="watchDescription"></p>
        </div>
        <aside class="up-next" aria-labelledby="upNextTitle">
          <div class="up-next__header">
            <h3 id="upNextTitle">Up next</h3>
            <button class="icon-button" type="button" aria-label="Close" title="Close" data-close-watch>
              <svg><use href="#icon-close"></use></svg>
            </button>
          </div>
          <div id="upNextList"></div>
        </aside>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
